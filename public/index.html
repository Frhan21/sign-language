<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Deteksi Bahasa Isyarat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Link ke Manifest PWA -->
    <link rel="manifest" href="manifest.json" />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- TensorFlow & MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.13.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  </head>

  <body>
    <div class="app-layout">
      <!-- Top Header -->
      <header class="app-header">
        <h1>Deteksi Bahasa Isyarat</h1>
        <div class="header-controls">
          <select id="mode-select">
            <option value="sibi">SIBI</option>
            <option value="bisindo">BISINDO</option>
          </select>
          <select id="camera-select"></select>
          <button class="btn-icon" onclick="switchCamera()" title="Ganti Kamera">🔄</button>
        </div>
      </header>

      <!-- Main Content -->
      <main class="app-main">
        <!-- Left Side: Video & Input Controls -->
        <section class="video-section card">
          <div class="video-wrapper">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="output-canvas"></canvas>
            <div id="input-mode-status" class="status-badge status-idle">Memuat...</div>
          </div>
          <div class="input-controls">
            <button id="voice-mode-btn" class="btn btn-primary">🎤 Mode Suara</button>
            <button id="gesture-mode-btn" class="btn btn-primary" disabled>🖐️ Mode Gestur</button>
          </div>
        </section>

        <!-- Right Side: Dashboard & Outputs -->
        <section class="dashboard-section">
          <!-- Main Highlight for Detected Gesture -->
          <div class="highlight-card card">
            <h2 class="card-title">Karakter Terdeteksi</h2>
            <div class="highlight-content">
              <div id="gesture-highlight" class="highlight-letter">-</div>
              <div id="confidence-badge" class="confidence-badge">Akurasi: 0%</div>
            </div>
            <p id="gesture-result" class="gesture-text">Gesture: -</p>
          </div>

          <!-- Sentence & Speech Output -->
          <div class="output-card card">
            <div class="card-header">
              <h2 class="card-title">Kalimat</h2>
              <div class="action-buttons">
                <!-- Advanced TTS Controls -->
                <button class="btn-icon btn-tts" onclick="speakSentence()" title="Mainkan Suara">▶️</button>
                <button class="btn-icon btn-tts" onclick="pauseSentence()" title="Jeda Suara">⏸️</button>
                <button class="btn-icon btn-tts" onclick="resetSentence()" title="Hapus Kalimat">🗑️</button>
              </div>
            </div>
            <div id="sentence-result" class="sentence-text"></div>
            
            <div class="stt-status">
              <span id="speech-result"><strong>STT:</strong> <i>Menunggu input suara...</i></span>
            </div>
          </div>
        </section>
      </main>

      <div id="error-container" class="error-toast"></div>
    </div>

    <!-- Script -->
    <script src="script.js"></script>
  </body>
</html>
